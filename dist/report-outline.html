</style></head><body><main><a href="/start.html">← 공부사주로 돌아가기</a><header><span>공부 운명서</span><h1>나를 이해하고,<br>공부를 바꾸는 열 장</h1><p>각 장은 지금의 모습, 막히는 이유, 바꿔볼 방법으로 이어져요.<br>아래는 준비 중인 리포트의 구성이에요. 개인별 해석 본문은 아직 제공하지 않아요.</p></header><nav class="tabs" aria-label="리포트 대상"><button type="button" data-audience="child" aria-pressed="true">자녀용</button><button type="button" data-audience="self" aria-pressed="false">본인용</button></nav><div id="outline" aria-live="polite"></div><footer>시기 해석은 연결과 확인을 마친 뒤 제공해요. 현재 리포트 구매는 열려 있지 않아요.</footer></main><script type="module" src="/report-outline.js"></script></body></html>
